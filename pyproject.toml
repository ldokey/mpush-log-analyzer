[project]
name = "mpush-log-analyzer"
version = "0.1.0"
description = "Local-first read-only MPushAgent log intake and case contract validation"
requires-python = ">=3.13,<3.15"
dependencies = [
    "streamlit>=1.40,<2",
    "jsonschema>=4.20,<5",
    "pandas>=2.2,<4",
    'tzdata>=2025.2; sys_platform == "win32"',
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["mpush_analyzer*"]
